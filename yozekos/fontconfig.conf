<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
<match target="pattern"><test name="family" compare="eq"><string>sans-serif</string></test><edit name="family" mode="prepend" binding="strong"><string>CozetteVector</string></edit></match>
<match target="pattern"><test name="family" compare="eq"><string>monospace</string></test><edit name="family" mode="prepend" binding="strong"><string>Pixeloid Mono</string></edit></match>
  <match target="font"><test name="family" compare="eq"><string>CozetteVector</string></test><edit name="antialias" mode="assign"><bool>false</bool></edit></match>
  <match target="font"><test name="family" compare="eq"><string>Pixeloid Sans</string></test><edit name="antialias" mode="assign"><bool>false</bool></edit></match>
  <match target="font"><test name="family" compare="eq"><string>Pixeloid Mono</string></test><edit name="antialias" mode="assign"><bool>false</bool></edit></match>
</fontconfig>
