# YozekOS terminal typography and theme
font_family Pixeloid Mono
font_size 13.0
window_padding_width 8
background_opacity 1.0
cursor_shape block
cursor_blink_interval 0
enable_audio_bell no
foreground #cdd6f4
background #1e1e2e
selection_foreground #ffffff
selection_background #45475a
cursor #cba6f7
cursor_text_color #1e1e2e
color0 #1e1e2e
color1 #cba6f7
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #89b4fa
color7 #cdd6f4
color8 #6c7086
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #bac2de
color13 #f5c2e7
color14 #94e2d5
color15 #ffffff
# Keep the login shell unchanged; load the compact prompt in Kitty only.
shell /run/current-system/sw/bin/bash --rcfile @HOME@/.config/kitty/bashrc
include rice-shell.conf

# YozekOS: blur & transparency switch (keep last)
globinclude rice-flat.conf

include rice-font.conf
